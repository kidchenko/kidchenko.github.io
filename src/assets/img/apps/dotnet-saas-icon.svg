<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Standalone copy of the dotnet-saas website logo (Logo.astro), with the
       currentColor fill pinned to the product's accent purple so it works as
       a plain <img>. -->
  <g fill="#7455dd" stroke="#7455dd">
    <circle cx="50" cy="50" r="42" fill="none" stroke-width="2" opacity="0.2"/>
    <circle cx="50" cy="50" r="32" fill="none" stroke-width="2" opacity="0.4"/>
    <g stroke="none">
      <rect x="30" y="14" width="9" height="72" rx="2"/>
      <rect x="61" y="14" width="9" height="72" rx="2"/>
      <rect x="13" y="34" width="74" height="9" rx="2"/>
      <rect x="13" y="57" width="74" height="9" rx="2"/>
      <rect x="30" y="34" width="9" height="9" rx="1" opacity="0.6"/>
      <rect x="61" y="34" width="9" height="9" rx="1" opacity="0.6"/>
      <rect x="30" y="57" width="9" height="9" rx="1" opacity="0.6"/>
      <rect x="61" y="57" width="9" height="9" rx="1" opacity="0.6"/>
    </g>
  </g>
</svg>
