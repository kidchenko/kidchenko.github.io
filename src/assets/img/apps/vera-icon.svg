<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified orbital ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#gradient-fav)" stroke-width="6" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gradient-fav)" stroke-width="3" opacity="0.3" />
  
  <!-- Four main connection points -->
  <g opacity="0.6" stroke="url(#gradient-fav)" stroke-width="4">
    <line x1="100" y1="100" x2="100" y2="30" />
    <line x1="100" y1="100" x2="170" y2="100" />
    <line x1="100" y1="100" x2="100" y2="170" />
    <line x1="100" y1="100" x2="30" y2="100" />
  </g>
  
  <!-- Main nodes -->
  <circle cx="100" cy="30" r="8" fill="#06b6d4" />
  <circle cx="170" cy="100" r="8" fill="#06b6d4" />
  <circle cx="100" cy="170" r="8" fill="#06b6d4" />
  <circle cx="30" cy="100" r="8" fill="#06b6d4" />
  
  <!-- Central circle background -->
  <circle cx="100" cy="100" r="38" fill="url(#gradient-fav)" opacity="0.2" />
  
  <!-- V -->
  <text x="100" y="125" font-size="70" font-weight="bold" fill="url(#gradient-fav)" text-anchor="middle" font-family="Arial, sans-serif">V</text>
</svg>
